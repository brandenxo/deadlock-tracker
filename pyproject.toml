[project]
name = "deadlock-tracker"
version = "0.1.0"
description = "Hourly Deadlock hero stats: public data lake -> DuckDB on Lambda -> S3 -> React dashboard"
requires-python = "==3.12.*"
dependencies = [
    "boto3==1.43.112",
    "duckdb==1.5.6",
]

[dependency-groups]
dev = [
    "moto[s3]==5.2.4",
    "pytest==9.1.1",
    "ruff==0.17.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.pyright]
pythonVersion = "3.12"
venvPath = "."
venv = ".venv"
extraPaths = [".", ".venv/lib/python3.12/site-packages"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["build", "data", "web"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
